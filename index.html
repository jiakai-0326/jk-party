<!doctype html>
<html lang="zh" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0908">
<title>朋友局 · JK 派对</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0b0908;--panel:#191411;--panel2:#221b16;--line:#33291f;--ink:#f5eee2;--mute:#a59988;--dim:#73695b;--gold:#d9b46a;--gold2:#f6e2a8;--gold3:#8a6a34;--red:#d2443a;--red2:#7d1712;--up:#63d08f;--dn:#f0685c;--ivory:#fbf6ea;
--fd:"Noto Serif SC","Songti SC","STSong",serif;--fb:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei","Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
html:has(#app.full){overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.4;min-height:100svh;
background-image:radial-gradient(130% 55% at 50% -12%,#4a1712 0%,rgba(74,23,18,0) 62%),radial-gradient(70% 40% at 100% 105%,#2a2110 0,rgba(42,33,16,0) 70%);background-attachment:fixed}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{-webkit-appearance:none;appearance:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
#app.full{padding:0;height:var(--vvh,100svh);overflow:hidden}
.page{padding-bottom:96px}
.up{color:var(--up)}.dn{color:var(--dn)}
.center{text-align:center}

/* ── 字、按钮、面板 ── */
.lbl,label{display:block;font-size:12px;color:var(--mute);margin-bottom:8px}
.panel{background:linear-gradient(180deg,rgba(34,27,22,.92),rgba(25,20,17,.92));border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
input{width:100%;background:#0f0c0a;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;outline:none}
input:focus{border-color:var(--gold)}
input::placeholder{color:var(--dim)}
.btn{display:block;width:100%;margin-top:10px;font:inherit;font-size:16px;font-weight:700;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);box-shadow:0 3px 0 #0a0706;transition:transform .07s,box-shadow .07s;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 #0a0706}
.btn.gold{background:linear-gradient(180deg,#fbeab6,#dbb568 70%,#c9a052);color:#1d1508;border:none;box-shadow:0 4px 0 var(--gold3),0 10px 24px rgba(217,180,106,.18)}
.btn.gold:active{box-shadow:0 1px 0 var(--gold3)}
.btn.ghost{background:transparent;color:var(--gold2);box-shadow:none}
.btn.big{font:900 19px var(--fd);padding:15px;letter-spacing:.04em}
.btn.sm{font-size:13px;padding:9px 14px;width:auto;margin:0;border-radius:11px}
.btn.dis{opacity:.4}
.btn.evilbtn{background:#5a1a1a;border-color:#8a2a2a;color:#ffd9d9}
.btn.wa{background:#1f8f55;border-color:#1f8f55;color:#fff;text-decoration:none;box-shadow:0 3px 0 #115a34}
.row2{display:flex;gap:10px}.row2 .btn{flex:1;margin-top:0}
.link{background:none;border:none;color:var(--gold);font:inherit;font-size:13px;padding:8px 0;text-decoration:underline;text-underline-offset:3px}
.pill{font:inherit;font-size:12px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);color:var(--gold2);white-space:nowrap}
.ib{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.07);color:var(--ink);font-size:17px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.hint{color:var(--mute);font-size:13px;line-height:1.6;margin-top:8px}
.err{color:#ff9a8f;background:rgba(210,68,58,.12);border:1px solid rgba(210,68,58,.35);padding:10px 12px;border-radius:12px;font-size:14px;margin:10px 0}
.note{background:#2a2015;border:1px solid #4a3a20;color:var(--gold2);padding:8px 12px;border-radius:10px;font-size:13px;margin:6px 12px}
.wait{text-align:center;color:var(--mute);font-size:14px;padding:13px 0}
.wait small{display:block;font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wait.sm{font-size:12px;padding:6px 0 0}
.tiny{text-align:center;color:#5a5348;font-size:11px;margin-top:22px}
.line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px;gap:8px}
.line:last-child{border-bottom:none}
.line.meRow{background:rgba(217,180,106,.12);border-radius:8px;padding-left:8px;padding-right:8px}
.line.col{flex-direction:column;align-items:flex-start}.line small{color:var(--mute);font-size:12px;line-height:1.5}
.spin{width:30px;height:30px;border:3px solid #3a2e18;border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:90px auto 16px}
.center p{color:var(--mute);margin-bottom:12px}
@keyframes sp{to{transform:rotate(360deg)}}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.3);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
@keyframes rowin{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(246,226,168,.7)}50%{box-shadow:0 0 0 7px rgba(246,226,168,0)}}

/* ── 头像 ── */
.av{width:32px;height:32px;border-radius:50%;background:var(--c,#d9b46a);color:#17120c;font:800 15px var(--fb);display:inline-flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 2px rgba(0,0,0,.55),0 3px 8px rgba(0,0,0,.4);position:relative}
.av.sm{width:24px;height:24px;font-size:12px}.av.lg{width:46px;height:46px;font-size:20px}
.av.off{filter:grayscale(1);opacity:.45}
.av.banker{box-shadow:0 0 0 2px var(--gold2),0 0 14px rgba(246,226,168,.7)}
.av.plus{background:transparent;border:1.5px dashed var(--dim);color:var(--mute);box-shadow:none}
.crown{font-style:normal;font:800 9px var(--fb);background:var(--gold2);color:#1a140a;border-radius:4px;padding:1px 4px;position:absolute;top:-7px;left:50%;transform:translateX(-50%);white-space:nowrap;z-index:3}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#e2b84f 55%,#9c7422);box-shadow:inset 0 0 0 1.5px rgba(120,80,10,.55);vertical-align:-2px;margin-right:4px;flex:none}

/* ── 上面那排 ── */
.top{display:flex;align-items:center;gap:8px;height:48px;padding:0 10px;flex:none;position:sticky;top:0;z-index:20;background:rgba(11,9,8,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.page>.top{margin:0 -16px 10px}
.roomchip{font:800 14px var(--fb);letter-spacing:.14em;color:var(--gold2);background:rgba(217,180,106,.1);border:1px solid rgba(217,180,106,.35);border-radius:10px;padding:5px 10px;display:flex;align-items:center;gap:6px}
.roomchip i{font-style:normal;font-weight:400;font-size:10px;letter-spacing:0;color:var(--mute)}
.ttl{flex:1;text-align:center;font:700 15px var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{display:flex;align-items:center;gap:6px}
.mych{font-weight:700;color:var(--gold2);font-size:14px;margin-right:2px}
.emobar{display:flex;justify-content:space-between;padding:4px 10px;background:rgba(0,0,0,.45);flex:none;position:relative;z-index:19}
.emobar button{font-size:25px;background:none;border:none;padding:4px 6px}
.emobar button:active{transform:scale(1.4)}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:84svh;overflow:auto;background:var(--panel);border-radius:22px 22px 0 0;border-top:1px solid var(--gold3);padding:14px 16px calc(18px + env(safe-area-inset-bottom));animation:sheetup .22s cubic-bezier(.2,.8,.2,1)}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sh-h b{font:900 20px var(--fd);color:var(--gold2);letter-spacing:.08em}
.mlist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.mlist button{text-align:left;font:inherit;font-size:15px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
.mlist .danger{color:#ff9a8f;border-color:#5a2420}

/* ── 首页 ── */
.hero{text-align:center;padding:46px 0 14px;position:relative}
.seal{display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:12px;background:linear-gradient(160deg,#e0483c,#a8231b);color:#fff3e6;font:900 19px/1.05 var(--fd);letter-spacing:.02em;transform:rotate(-7deg);box-shadow:inset 0 0 0 2px rgba(255,235,220,.55),inset 0 0 0 4px #b3271e,0 8px 22px rgba(168,35,27,.45);writing-mode:vertical-rl}
h1{font:900 64px/1.05 var(--fd);margin:14px 0 0;letter-spacing:.06em;background:linear-gradient(180deg,#fff4cf 5%,#e7c57c 48%,#a67c35 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(217,180,106,.25))}
.hero p{color:var(--mute);font-size:14px;line-height:1.7;margin-top:10px}
.invite{text-align:center}.inv-t{font-size:13px;color:var(--mute)}
.inv-code{font:900 56px var(--fd);letter-spacing:.16em;color:var(--gold2);margin:2px 0 12px;padding-left:.16em}
.joinrow{display:flex;gap:8px;margin-top:12px}
.joinrow input{flex:1;text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:700}
.joinrow input::placeholder{letter-spacing:0;font-weight:400}
.joinrow .btn{width:auto;margin:0;padding:0 24px}
.acct input+input{margin-top:8px}.acct .row2{margin-top:10px}
.who2{display:flex;align-items:center;gap:12px;margin-bottom:12px}.who2 b{display:block;font-size:18px}.who2 span:not(.av){font-size:12px;color:var(--mute)}
.shelf{margin-top:20px}.shelfrow{display:flex;flex-wrap:wrap;gap:8px}
.chipg{display:flex;align-items:center;gap:6px;font-size:13px;padding:6px 12px 6px 8px;border-radius:99px;background:#15110e;background:color-mix(in srgb,var(--gc) 16%,#15110e);border:1px solid #2a221b;border-color:color-mix(in srgb,var(--gc) 42%,#2a221b)}
.tabs,.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px -16px 10px;padding:0 16px}
.tabs::-webkit-scrollbar,.cats::-webkit-scrollbar,.nrow::-webkit-scrollbar{display:none}
.tab,.cat{font:inherit;font-size:13px;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--mute);white-space:nowrap;flex:none}
.tab.on,.cat.on{background:var(--ink);color:#141210;border-color:var(--ink);font-weight:700}
.mystats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mystats div{background:#0f0c0a;border-radius:10px;padding:8px 10px}.mystats span{display:block;font-size:11px;color:var(--mute)}.mystats b{font-size:15px;color:var(--gold2)}

/* ── 大厅 ── */
.roomcard{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;background:linear-gradient(135deg,#4a1510,#200b09 62%);border:1px solid #6a251d;box-shadow:0 12px 36px rgba(120,25,18,.25)}
.rc-l span{font-size:11px;color:#e3a99f}
.rc-l b{display:block;font:900 40px/1.1 var(--fd);letter-spacing:.14em;color:var(--gold2)}
.rc-r{display:flex;flex-direction:column;gap:8px}.rc-r .btn{white-space:nowrap}
.people{margin-top:18px}
.plist{display:grid;grid-template-columns:repeat(6,1fr);gap:14px 4px}
.pp{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;font:inherit;font-size:11px;background:none;border:none;color:var(--ink);min-width:0}
.pp>span:last-of-type{max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pp .x{position:absolute;top:-6px;right:2px;width:19px;height:19px;border-radius:50%;border:none;background:#3a2622;color:#ffb3a8;font-size:13px;line-height:19px;padding:0}
.night{margin-top:18px}
.nrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.nn{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:12px;white-space:nowrap;flex:none}
.nn b{color:var(--gold2);font-size:14px}.nn.top{border-color:var(--gold);background:#2a2013}
.pick{margin-top:22px}
.pick-h{display:flex;justify-content:space-between;align-items:center}.pick-h .lbl{margin:0;font:700 17px var(--fd);color:var(--ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;text-align:left;font:inherit;color:var(--ink);padding:12px 12px 11px;border-radius:16px;border:1px solid var(--line);background:#15110e;background:linear-gradient(155deg,color-mix(in srgb,var(--gc) 26%,#15110e),#15110e 72%);box-shadow:0 4px 0 #070504;display:flex;flex-direction:column;gap:2px;transition:transform .08s,box-shadow .08s;overflow:hidden;min-width:0}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #070504}
.tile .ti{font-size:30px;line-height:1.15}
.tile b{font:700 16px var(--fd)}
.tile small{font-size:11px;color:var(--mute);line-height:1.4;min-height:2.8em}
.tile em{font-style:normal;font-size:10px;color:#d8cfc2;color:color-mix(in srgb,var(--gc) 55%,#fff);margin-top:3px}
.tile.sel{border-color:var(--gold2);box-shadow:0 4px 0 var(--gold3),inset 0 0 0 1px var(--gold2)}
.tile.sel::after{content:"✓";position:absolute;top:9px;right:10px;width:21px;height:21px;border-radius:50%;background:var(--gold2);color:#1a140a;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
.tile.spin{transform:scale(1.05);border-color:#fff;box-shadow:0 0 26px var(--gc)}
.selinfo{border-color:#4a3a2a;border-color:color-mix(in srgb,var(--gc) 45%,var(--line))}
.si-h{display:flex;gap:12px;align-items:center}.si-h .ti{font-size:36px;line-height:1}
.si-h b{font:700 18px var(--fd)}.si-h p{font-size:13px;color:var(--mute);line-height:1.5;margin-top:2px}
.selinfo label{margin-top:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:52px;font:inherit;font-size:14px;padding:10px 6px;border-radius:11px;border:1px solid var(--line);background:#0f0c0a;color:var(--mute)}
.seg button.on{border-color:var(--gold);color:var(--gold2);background:#261c10;font-weight:700}
.startbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:18px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(11,9,8,0),rgba(11,9,8,.96) 38%)}
.startbar>*{max-width:528px;margin:0 auto}

/* ── 整屏的游戏画面 ── */
.stage{height:var(--vvh,100svh);display:flex;flex-direction:column;position:relative;overflow:hidden}
.smain{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.bar{flex:none;padding:6px 14px calc(10px + env(safe-area-inset-bottom));min-height:72px;display:flex;flex-direction:column;justify-content:center}
.bar .btn{margin-top:0}.bar .link{display:block;margin:2px auto 0;padding:4px 0}
.tbl{flex:1;min-height:0;position:relative}
.tbl .felt{position:absolute;left:6%;right:6%;top:16px;bottom:4px;border-radius:50%/48%;background:radial-gradient(ellipse at 50% 38%,#237a50,#11492f 62%,#0a2e1d);box-shadow:0 0 0 6px #3d2412,0 0 0 8px #9a7238,0 0 0 9px #3d2412,0 18px 44px rgba(0,0,0,.7),inset 0 0 50px rgba(0,0,0,.5)}
.seat{position:absolute;display:flex;z-index:2;cursor:pointer}
.seat.st{flex-direction:column;align-items:center;transform:translate(-50%,-16px);text-align:center}
.seat.sl{flex-direction:row;align-items:flex-start;gap:3px;transform:translate(-26px,-16px)}
.seat.sr{flex-direction:row-reverse;align-items:flex-start;gap:3px;transform:translate(calc(-100% + 26px),-16px)}
.who{display:flex;flex-direction:column;align-items:center;width:52px;position:relative;flex:none}
.crd{display:flex;flex-direction:column;align-items:center}
.seat.sl .crd{align-items:flex-start;padding-top:2px}.seat.sr .crd{align-items:flex-end;padding-top:2px}
.seat .nm{font-size:11px;max-width:60px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-top:3px;text-shadow:0 1px 3px #000}
.seat .ch{font-size:10px;line-height:14px;color:var(--gold2);background:rgba(0,0,0,.55);padding:0 7px;border-radius:99px}
.mini{display:flex;margin-top:3px;min-height:10px}
.mc{display:block;margin-left:-7px}.mc:first-child{margin-left:0}
.mini:has(.mc:nth-child(4)) .mc+.mc{margin-left:-9px}
.seat.opened .mini{animation:toss .45s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:var(--eo,0ms);filter:drop-shadow(0 0 6px rgba(246,226,168,.6))}
@keyframes toss{0%{transform:none}45%{transform:translateY(-10px) scale(1.25) rotate(-5deg)}100%{transform:translateY(5px) scale(1.1)}}
.tg2{font-size:10px;margin-top:3px;background:rgba(0,0,0,.74);border:1px solid rgba(246,226,168,.28);border-radius:6px;padding:1px 6px;color:var(--gold2);white-space:nowrap;position:relative;z-index:3}
.tg2.ok{border-color:#2f7a4b;color:#a6f0c0}.tg2.dim{color:#b9c9bd;border-color:transparent;background:rgba(0,0,0,.4)}
.tg2.popin{animation:pop .5s both;animation-delay:var(--eo,0ms)}
.seat.pick .av{animation:pulse 1.1s infinite}
.openme{font:800 10px var(--fb);background:var(--gold2);color:#1a140a;border-radius:6px;padding:1px 7px;margin-top:3px}
.tc{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;width:58%;z-index:1;pointer-events:none}
.tc-st{font-size:12px;color:#cfe8d6}
.tc-row{display:flex;align-items:center;gap:12px;min-height:34px}
.ante{font-size:11px;color:#cfe8d6;display:flex;align-items:baseline;gap:5px}
.ante b{font:900 28px/1 var(--fd);color:var(--gold2);text-shadow:0 2px 0 rgba(0,0,0,.4)}
.ante.pop b{animation:pop .5s both;animation-delay:calc(var(--el,0ms) + 750ms)}
.dice{display:flex;align-items:center;gap:6px}.plus{color:var(--gold2);font-weight:700}
.die{width:30px;height:30px;background:var(--ivory);border-radius:7px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:4px;box-shadow:0 3px 0 #c8bfae,0 5px 10px rgba(0,0,0,.45)}
.die i{width:6px;height:6px;border-radius:50%;background:#1b1b1b;align-self:center;justify-self:center}
.d1 i,.d4 i{background:#c0302a}.d1 i{grid-area:2/2}
.d2 i:nth-child(1),.d3 i:nth-child(1),.d4 i:nth-child(1),.d5 i:nth-child(1),.d6 i:nth-child(1){grid-area:1/1}
.d2 i:nth-child(2),.d3 i:nth-child(3),.d4 i:nth-child(4),.d5 i:nth-child(5),.d6 i:nth-child(6){grid-area:3/3}
.d3 i:nth-child(2),.d5 i:nth-child(3){grid-area:2/2}
.d4 i:nth-child(2),.d5 i:nth-child(2),.d6 i:nth-child(2){grid-area:1/3}
.d4 i:nth-child(3),.d5 i:nth-child(4),.d6 i:nth-child(3){grid-area:3/1}
.d6 i:nth-child(4){grid-area:2/1}.d6 i:nth-child(5){grid-area:2/3}
.dice.rolling .die{animation:roll .8s cubic-bezier(.3,.6,.3,1) both;animation-delay:var(--el,0ms)}

.links{display:flex;gap:20px;justify-content:center}.bar .links .link{margin:2px 0 0}

.sdsheet.quick{animation-delay:var(--el,0ms)}
.sdsheet.quick .srow{animation-delay:calc(var(--el,0ms) + 160ms + var(--i) * 50ms)}

/* 大家互相看得到 */
.rivals{display:flex;gap:6px 4px;justify-content:center;flex-wrap:wrap;padding:8px 0 4px;flex:none}

/* ───── 大话骰 ───── */
.liar{padding:6px 12px 0;gap:8px}
.lr-list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:5px}
.lr-p{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:13px;background:rgba(255,255,255,.04);border:1px solid transparent;min-height:46px}
.lr-list.tight{display:grid;grid-template-columns:1fr 1fr;gap:4px;align-content:start}

.lr-list.tight .lr-n{width:auto;flex:1 1 0}.lr-list.tight .lr-n b{font-size:12px}.lr-list.tight .lr-n small{font-size:10px;white-space:nowrap;overflow:hidden}
.lr-list.tight .av{width:24px;height:24px;font-size:11px}
.lr-list.tight .lr-d{gap:2px;flex:none}.lr-list.tight .lr-d .die{width:15px;height:15px;padding:2px;border-radius:3px;box-shadow:none}.lr-list.tight .lr-d .die i{width:3px;height:3px}
.lr-list.tight .lr-say{font-size:12px;gap:3px}.lr-list.tight .lr-think{font-size:10px}
.lr-p.turn{border-color:var(--gold);background:rgba(217,180,106,.12);box-shadow:0 0 16px rgba(217,180,106,.25)}
.lr-p.lose{border-color:#c94a4a;background:rgba(201,74,74,.16)}.lr-p.win{border-color:#5fd08f;background:rgba(95,208,143,.12)}
.lr-n{display:flex;flex-direction:column;min-width:0;width:86px;flex:none}.lr-n b{font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.lr-n small{font-size:11px;color:var(--mute)}
.lr-p.me .lr-n b{color:var(--gold2)}
.lr-d{margin-left:auto;display:flex;gap:3px;align-items:center}
.lr-d .die{width:22px;height:22px;padding:3px;border-radius:5px;box-shadow:0 2px 0 #c8bfae}.lr-d .die i{width:4px;height:4px}
.die.dim{opacity:.32}.die.hit{box-shadow:0 0 0 2px var(--gold2),0 0 10px rgba(246,226,168,.8)}
.lr-say{display:flex;align-items:center;gap:5px;font:800 14px var(--fb);color:var(--mute)}.lr-say.now{color:var(--gold2)}
.lr-think{font-size:12px;color:var(--gold2);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.lr-mid{flex:none;text-align:center;padding:8px 6px;border-radius:16px;background:radial-gradient(ellipse at 50% 0,#245a3f,#123324);border:1px solid rgba(246,226,168,.25)}
.lr-mid small{display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;color:#cfe8d6}

.lr-mid b.first{font-size:22px}.lr-mid b.ok{color:#8dffb8}.lr-mid b.no{color:#ff8a7a}
.lr-mid span{font-size:12px;color:#cfe8d6}.lr-mid.show span{font-size:14px;color:#fff;font-weight:700}
.lr-mid small .die{width:18px;height:18px;padding:2px;border-radius:4px}.lr-mid small .die i{width:3.5px;height:3.5px}

.lr-pick{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 14px;margin-bottom:8px}
.lr-step{display:flex;align-items:center;gap:6px;flex:none}.lr-step b{font:900 30px var(--fd);color:var(--gold2);min-width:44px;text-align:center}.lr-step span{color:var(--mute);font-size:13px}
.lr-step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#1a140e;color:var(--ink);font:800 24px var(--fb)}
.lr-faces{display:flex;gap:2px;flex:none;justify-content:center}
.lr-faces button{padding:5px;border-radius:10px;border:2px solid transparent;background:none}.lr-faces button.on{border-color:var(--gold2);background:rgba(246,226,168,.14)}
.lr-faces .die{width:28px;height:28px;padding:4px;box-shadow:0 2px 0 #c8bfae}.lr-faces .die i{width:5px;height:5px}
.btn.red{background:linear-gradient(180deg,#ff7a66,#c8322b);color:#fff;border:none;box-shadow:0 4px 0 #7a1a14}
.btn[disabled]{opacity:.45}
/* ───── 炸弹传递 ───── */
.bomb{padding:8px 12px 0;--heat:0;background:radial-gradient(ellipse at 50% 45%,rgba(217,68,43,calc(var(--heat) * .38)),transparent 70%);position:relative}
.bomb.hot{animation:hotbg .5s infinite alternate}
@keyframes hotbg{from{box-shadow:inset 0 0 0 0 rgba(217,68,43,0)}to{box-shadow:inset 0 0 70px 6px rgba(217,68,43,.55)}}
.bm-top{text-align:center;flex:none;padding:6px 0 10px}.bm-top h3{font:900 24px var(--fd);color:var(--gold2)}.bm-top.mine h3{color:#ff8a7a;font-size:28px;animation:blink .45s infinite}
.bm-top p{font-size:13px;color:var(--mute);margin-top:2px;min-height:18px}
.bm-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:center;overflow:auto}
.bm-grid.tight{grid-template-columns:repeat(4,1fr);gap:6px}
.bm-p{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:18px;border:2px solid transparent;background:rgba(255,255,255,.04);color:var(--ink);font:inherit;touch-action:none}
.bm-p small{font-size:12px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bm-av{position:relative;display:block}.bm-av .av{width:58px;height:58px;font-size:22px}.bm-grid.tight .bm-av .av{width:46px;height:46px;font-size:18px}
.bm-p.me small{color:var(--gold2);font-weight:700}
.bm-p.can{border-color:rgba(246,226,168,.55);background:rgba(246,226,168,.09)}.bm-p.can:active,.bm-p.sent{transform:scale(.92);background:rgba(246,226,168,.3)}
.bm-p.has{border-color:#ff6a4a;background:rgba(217,68,43,.25);box-shadow:0 0 26px rgba(217,68,43,.6)}
.bm-p.dead{opacity:.32;filter:grayscale(1)}.bm-p.boom{opacity:1;filter:none;animation:popin .5s both}
.bm-b{position:absolute;right:-14px;bottom:-10px;font-size:34px;font-style:normal;animation:bmin .35s cubic-bezier(.2,.9,.3,1.5) both,bmshake .22s .35s infinite;animation-delay:var(--eo,0ms),calc(var(--eo,0ms) + 350ms)}
.bm-x{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-style:normal}
@keyframes bmin{from{transform:translateY(-60px) scale(2.2);opacity:0}}@keyframes bmshake{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg) scale(1.08)}}
.bm-cd{position:absolute;inset:0;display:grid;place-items:center;font:900 120px var(--fd);color:var(--gold2);text-shadow:0 6px 0 #6b4a16;background:rgba(9,7,6,.55);pointer-events:none}
/* ───── 你画我猜 ───── */
.draw{padding:4px 12px 0;gap:6px}
.dg-h{flex:none;display:flex;align-items:center;gap:10px;min-height:38px}
.dg-t{font:900 22px var(--fd);color:var(--gold2);min-width:34px}.dg-h b{flex:1;text-align:center;font:800 19px var(--fb);letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg-who{font-size:11px;color:var(--mute);text-align:right;max-width:104px}
.dg-board{flex:1 1 auto;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;container-type:size}
.dg-cv{display:block;flex:none;width:min(100cqw,100cqh);height:min(100cqw,100cqh);background:#fff;border-radius:14px;touch-action:none;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.dg-board.mine .dg-cv{box-shadow:0 0 0 3px var(--gold2),0 6px 24px rgba(0,0,0,.5);cursor:crosshair}
.dg-tools{flex:none;display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap}
.dg-c{width:27px;height:27px;flex:none;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:var(--c);font-size:11px;color:#333;padding:0}
.dg-c.on{box-shadow:0 0 0 3px var(--gold2);transform:scale(1.12)}
.dg-b{height:30px;min-width:32px;padding:0 6px;flex:none;border-radius:9px;border:1px solid var(--line);background:#1a140e;color:var(--ink);font:700 13px var(--fb)}.dg-b.on{border-color:var(--gold2);color:var(--gold2)}
.dg-feed{flex:none;height:74px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;font-size:13px;line-height:1.35}
.dg-feed p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d8d2c6}.dg-feed p.ok{color:#8dffb8;font-weight:700}.dg-feed p.near{color:var(--gold2)}.dg-feed p.sys{color:var(--mute);text-align:center;font-size:11px}
.dg-ppl,.dg-res{flex:none;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:34px}
.dg-ppl span,.dg-res span{position:relative;opacity:.45}.dg-ppl span.ok,.dg-res span{opacity:1}
.dg-ppl i{position:absolute;right:-3px;bottom:-3px;font-style:normal;font-size:12px;color:#0c2a18;background:#8dffb8;border-radius:50%;width:15px;height:15px;display:grid;place-items:center}.dg-ppl span:not(.ok) i{display:none}
.dg-res{padding:8px 0}.dg-res span{display:flex;flex-direction:column;align-items:center}.dg-res i{font-style:normal;font:800 13px var(--fb);color:#8dffb8}.dg-res em{color:var(--mute);font-style:normal}
.dg-pick{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center}.dg-pick h3{font:900 24px var(--fd);color:var(--gold2)}.dg-big{font-size:70px}
.dg-in{display:flex;gap:8px;flex:none;width:100%}.dg-in input{padding:10px 12px;width:auto}.dg-in .btn{width:auto;min-width:72px}.dg-in input{flex:1;min-width:0}.dg-in .btn{flex:none;padding:0 22px}
.dg-ok{display:none;flex:1;text-align:center;font:800 16px var(--fb);color:#8dffb8;padding:14px 0}
.dg-in.got input,.dg-in.got .btn{display:none}.dg-in.got .dg-ok{display:block}

.tile .nw{position:absolute;right:10px;top:10px;font:800 11px var(--fb);font-style:normal;background:#e23b2e;color:#fff;border-radius:8px;padding:2px 7px;box-shadow:0 2px 8px rgba(226,59,46,.5)}

/* ───── 红蓝密码 ───── */
.code{padding:4px 10px 0;gap:6px}
.cd-teams{display:flex;gap:6px;flex:none}
.cd-t{flex:1;min-width:0;border-radius:12px;padding:6px 8px;border:2px solid transparent;opacity:.7}
.cd-t.red{background:rgba(226,59,46,.16)}.cd-t.blue{background:rgba(43,127,217,.18)}
.cd-t.on{opacity:1}.cd-t.red.on{border-color:#ff7b6b}.cd-t.blue.on{border-color:#6bb8ff}
.cd-t b{display:block;font:800 14px var(--fb)}.cd-t.red b{color:#ff9a8a}.cd-t.blue b{color:#8fd0ff}
.cd-t span{display:flex;flex-wrap:wrap;gap:2px 6px;font-size:11px;color:#d8d2c6;margin-top:2px}.cd-t i{font-style:normal;white-space:nowrap}.cd-t i.me{color:var(--gold2);font-weight:800}
.cd-mid{flex:none;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;padding:4px 8px;text-align:center}
.cd-mid.red{background:linear-gradient(180deg,rgba(226,59,46,.3),rgba(226,59,46,.1))}.cd-mid.blue{background:linear-gradient(180deg,rgba(43,127,217,.34),rgba(43,127,217,.1))}
.cd-mid b{font:900 26px/1.15 var(--fd);color:#fff}.cd-mid span{font-size:12px;color:#e8e2d6}
.cd-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:5px}
.cd-c{position:relative;min-width:0;border-radius:10px;border:2px solid #cdbf9f;background:#efe6d0;color:#1b1710;font:800 17px var(--fb);padding:0;display:grid;place-items:center;box-shadow:0 3px 0 #a8997a}
.cd-c.long{font-size:13px}.cd-c span{pointer-events:none}.cd-c i{position:absolute;right:2px;top:1px;font-size:11px;font-style:normal}
.cd-grid.pick .cd-c:not(.rev){border-color:var(--gold2)}
.cd-c.sel{transform:scale(1.07);box-shadow:0 0 0 3px var(--gold2),0 0 18px rgba(246,226,168,.8);z-index:2}
.code.key .cd-c.red:not(.rev){background:#f6c4bc;border-color:#e23b2e;color:#7a140c}.code.key .cd-c.blue:not(.rev){background:#bcdcf8;border-color:#2b7fd9;color:#0c3a6e}
.code.key .cd-c.neu:not(.rev){background:#d9d2c2;border-color:#9a9282;color:#5a5448}.code.key .cd-c.bomb:not(.rev){background:#2a2622;border-color:#000;color:#fff}
.cd-c.rev{box-shadow:none;color:#fff;animation:cdflip .45s both;animation-delay:var(--eo,0ms)}

<div id="app"></div>
<script>// 牛冬菇 1.0 规则引擎（纯函数，不碰网络和画面）
// 牌：{r:1..13, s:'S'|'H'|'D'|'C'} ；鬼牌：{j:1}（id 用来分辨）
const NDG = (() => {
  const SUITS = ['S', 'H', 'D', 'C'];

  function newDeck(decks = 1, jokers = true) {
    const d = [];
    for (let k = 0; k < decks; k++) {
      const pre = decks > 1 ? 'ab'[k] : '';
      for (const s of SUITS) for (let r = 1; r <= 13; r++) d.push({ id: pre + s + r, r, s });
      if (jokers) d.push({ id: pre + 'J1', j: 1 }, { id: pre + 'J2', j: 1 });
    }
    for (let i = d.length - 1; i > 0; i--) {
      const k = Math.floor(Math.random() * (i + 1));
      [d[i], d[k]] = [d[k], d[i]];
    }
    return d;
  }

  const isBigA = c => !c.j && c.r === 1 && c.s === 'S';
  const isFace = c => !c.j && c.r >= 11;
  const pt = r => (r >= 10 ? 10 : r); // A=1，10/J/Q/K=10
  const ALL52 = [];
  for (const s of SUITS) for (let r = 1; r <= 13; r++) ALL52.push({ r, s });

  // 把鬼牌换成各种可能，回调每一种组合
  function eachSub(cards, opts, fn) {
    const idx = cards.map((c, i) => (c.j ? i : -1)).filter(i => i >= 0);
    if (!idx.length) return fn(cards, []);
    const rec = (k, cur) => {
      if (k === idx.length) return fn(cur, idx);
      for (const o of opts) {
        const n = cur.slice();
        n[idx[k]] = { ...o, fromJoker: true };
        rec(k + 1, n);
      }
    };
    rec(0, cards);
  }
  const cmp = (a, b) => {
    for (let i = 0; i < Math.max(a.length, b.length); i++) {
      const d = (a[i] || 0) - (b[i] || 0);
      if (d) return d;
    }
    return 0;
  };

  // ───── 开局：骰子 ─────
  function rollAnte(rnd = Math.random) {
    const d1 = 1 + Math.floor(rnd() * 6);
    if (d1 !== 1) return { dice: [d1], ante: d1 };
    const d2 = 1 + Math.floor(rnd() * 6);
    return { dice: [1, d2], ante: 1 + d2 };
  }

  // ───── 第一关：1 张比大小 ─────
  // 大小：2…K < A < 大A（黑桃A）；鬼牌 = 大A，但碰上真的大A，大A 赢 ×4
  function s1Val(c) {
    if (c.j) return 15;
    if (isBigA(c)) return 15;
    if (c.r === 1) return 14;
    return c.r;
  }
  function s1Label(c) {
    if (c.j) return '鬼牌（当大A）';
    if (isBigA(c)) return '大A';
    if (c.r === 1) return 'A';
    return '';
  }
  // 同样号码撞：比花色 黑桃 > 红心 > 梅花 > 方块，小的赔双倍
  const SUIT_RANK = { S: 4, H: 3, C: 2, D: 1 };
  function s1Compare(a, b) { // >0 a 赢；返回 {w:+1/-1/0, mult, why}
    if (a.j && b.j) return { w: 0, rps: true }; // 鬼牌撞鬼牌：剪刀石头布，输的赔 ×3×2
    if (a.j && isBigA(b)) return { w: -1, mult: 6, why: '鬼牌撞大A，鬼牌赔 ×3×2' };
    if (b.j && isBigA(a)) return { w: 1, mult: 6, why: '鬼牌撞大A，鬼牌赔 ×3×2' };
    const d = a.r === 1 && b.r === 1 ? 0 : s1Val(a) - s1Val(b); // A 撞 A（包括大A）也算同号码
    if (!d) {
      const sd = SUIT_RANK[a.s] - SUIT_RANK[b.s];
      if (!sd) return { w: 0 }; // 两副牌才会一模一样
      const base = a.r === 1 ? 2 : 1;
      return { w: sd > 0 ? 1 : -1, mult: base * 2, why: '同点撞，比花色 ×' + base + '×2' };
    }
    const win = d > 0 ? a : b;
    const mult = win.j || isBigA(win) ? 3 : win.r === 1 ? 2 : 1;
    const why = mult === 3 ? '大A ×3' : mult === 2 ? 'A ×2' : '比大小';
    return { w: d > 0 ? 1 : -1, mult, why };
  }

  // ───── 第二关：3 张看点数（加起来取个位） ─────
  // 三张全公仔（鬼牌也算）×4；三张一样（或一样 + 鬼牌）×4
  const S2_OPTS = [];
  for (let r = 1; r <= 13; r++) S2_OPTS.push({ r, s: 'H' });
  function s2Eval(cards) {
    let best = null;
    eachSub(cards, S2_OPTS, cs => {
      const points = cs.reduce((t, c) => t + pt(c.r), 0) % 10;
      const allFace = cs.every(c => c.r >= 11);
      const trips = cs[0].r === cs[1].r && cs[1].r === cs[2].r;
      const special = allFace || trips;
      const ten = !special && points === 0; // 加起来刚好 10 / 20 / 30 = 满点
      const score = [special ? 2 : ten ? 1 : 0, points];
      if (!best || cmp(score, best.score) > 0)
        best = { score, points, special, ten, label: trips ? '三张一样 ×4' : allFace ? '三张公仔 ×4' : ten ? '十点（满）×2' : points + ' 点' };
    });
    return best;
  }
  function s2Compare(a, b) {
    const d = cmp(a.score, b.score);
    if (!d) return { w: 0 };
    const win = d > 0 ? a : b;
    return { w: d > 0 ? 1 : -1, mult: win.special ? 4 : win.ten ? 2 : 1, why: win.label };
  }

  // ───── 第三关：5 张凑十 ─────
  // 底 3 张凑 10/20/30（3 和 6 可以互换），再看上面 2 张
  // 等级：0 没牛 · 1 有牛 1–9 点 · 2 十点 ×2 · 3 对子 ×3 · 4 公仔+大A ×5
  const S3_MULT = [1, 1, 2, 3, 5];
  const S3_OPTS = [];
  for (let r = 1; r <= 13; r++) S3_OPTS.push({ r, s: r === 1 ? 'S' : 'H' }, ...(r === 1 ? [{ r: 1, s: 'H' }] : []));
  const COMBOS3 = [];
  for (let a = 0; a < 5; a++) for (let b = a + 1; b < 5; b++) for (let c = b + 1; c < 5; c++) COMBOS3.push([a, b, c]);
  function bottomOk(cs) {
    // 每张 3 或 6 可以当 3 也可以当 6
    let sums = [0];
    for (const c of cs) {
      const vs = c.r === 3 || c.r === 6 ? [3, 6] : [pt(c.r)];
      const n = [];
      for (const s of sums) for (const v of vs) n.push(s + v);
      sums = n;
    }
    return sums.some(s => s % 10 === 0);
  }
  // only = 自己排的时候，下面 3 张的 id；有给就只算这个排法
  function s3Eval(cards, only) {
    let best = { score: [0, 0], cat: 0, points: 0, label: '没凑成', bottom: [], top: [], jokerTen: false };
    let combos = COMBOS3;
    if (only) {
      const c = only.map(id => cards.findIndex(x => x.id === id)).sort((a, b) => a - b);
      if (c.length !== 3 || c.some(i => i < 0) || new Set(c).size !== 3) return best;
      combos = [c];
    }
    eachSub(cards, S3_OPTS, cs => {
      for (const combo of combos) {
        const bot = combo.map(i => cs[i]);
        if (!bottomOk(bot)) continue;
        const topIdx = [0, 1, 2, 3, 4].filter(i => !combo.includes(i));
        const top = topIdx.map(i => cs[i]);
        // 上面 2 张：3 也可以当 6（6 也可以当 3），挑最好的
        const tv = c => (c.r === 3 || c.r === 6 ? [3, 6] : [pt(c.r)]);
        let points = -1;
        for (const x of tv(top[0])) for (const y of tv(top[1])) { const p = (x + y) % 10; if (points < 0 || (p === 0 ? 10 : p) > (points === 0 ? 10 : points)) points = p; }
        let cat = points === 0 ? 2 : 1, label = points === 0 ? '十点 ×2' : points + ' 点';
        let sub = points;
        if (top[0].r === top[1].r) { cat = 3; label = '对子 ×3'; sub = top[0].r === 1 ? 14 : top[0].r; }
        const faceBigA = (isFace(top[0]) && isBigA(top[1])) || (isFace(top[1]) && isBigA(top[0]));
        if (faceBigA) { cat = 4; label = '公仔 + 大A ×5'; sub = 0; }
        const score = [cat, sub];
        if (cmp(score, best.score) > 0)
          best = {
            score, cat, points, label,
            bottom: combo.map(i => cards[i].id), top: topIdx.map(i => cards[i].id),
            jokerTen: cat === 2 && cards.some(c => c.j), // 用到鬼牌的十点
          };
      }
    });
    return best;
  }
  function s3Compare(a, b) {
    // 鬼牌凑的十点 碰上 正牌十点：鬼牌赔双倍的双倍（×4）
    if (a.cat === 2 && b.cat === 2 && a.jokerTen !== b.jokerTen) {
      return { w: a.jokerTen ? -1 : 1, mult: 4, why: '真十点撞鬼牌十点，鬼牌赔 ×2×2' };
    }
    const d = cmp(a.score, b.score);
    if (!d) return { w: 0 };
    const win = d > 0 ? a : b;
    return { w: d > 0 ? 1 : -1, mult: S3_MULT[win.cat], why: win.label };
  }

  // ───── 第四关：5 张手牌 + 2 张公牌，比最大扑克组合 ─────
  const S4_NAMES = ['散牌', '一对', '两对 ×2', '三条 ×3', '顺子 ×4', '同花 ×5', '葫芦 ×6', '四条 ×7', '同花顺 ×12'];
  const S4_MULT = [1, 1, 2, 3, 4, 5, 6, 7, 12];
  function rank5(cs) {
    const rs = cs.map(c => (c.r === 1 ? 14 : c.r)).sort((a, b) => b - a);
    const flush = cs.every(c => c.s === cs[0].s);
    const uniq = [...new Set(rs)];
    let straightHigh = 0;
    if (uniq.length === 5) {
      if (rs[0] - rs[4] === 4) straightHigh = rs[0];
      else if (rs.join() === '14,5,4,3,2') straightHigh = 5;
    }
    const cnt = {};
    rs.forEach(r => (cnt[r] = (cnt[r] || 0) + 1));
    const groups = Object.entries(cnt).map(([r, n]) => [n, +r]).sort((a, b) => b[0] - a[0] || b[1] - a[1]);
    const g = groups.map(x => x[0]);
    const kick = groups.map(x => x[1]);
    if (straightHigh && flush) return [8, straightHigh];
    if (g[0] >= 4) return [7, ...kick];
    if (g[0] === 3 && g[1] === 2) return [6, ...kick];
    if (flush) return [5, ...rs];
    if (straightHigh) return [4, straightHigh];
    if (g[0] === 3) return [3, ...kick];
    if (g[0] === 2 && g[1] === 2) return [2, ...kick];
    if (g[0] === 2) return [1, ...kick];
    return [0, ...rs];
  }
  const COMBOS5 = [];
  for (let a = 0; a < 7; a++) for (let b = a + 1; b < 7; b++) {
    COMBOS5.push([0, 1, 2, 3, 4, 5, 6].filter(i => i !== a && i !== b));
  }
  // only = 自己挑的 5 张 id；有给就只算这 5 张
  function s4Eval(cards7, only) {
    let best = null, combos = COMBOS5;
    if (only) { const c = only.map(id => cards7.findIndex(x => x.id === id)).sort((a, b) => a - b); if (c.length === 5 && c.every(i => i >= 0) && new Set(c).size === 5) combos = [c]; }
    eachSub(cards7, ALL52, cs => {
      for (const combo of combos) {
        const score = rank5(combo.map(i => cs[i]));
        if (!best || cmp(score, best.score) > 0) best = { score, used: combo.map(i => cards7[i].id) };
      }
    });
    best.cat = best.score[0];
    best.label = S4_NAMES[best.cat];
    return best;
  }
  function s4Compare(a, b) {
    const d = cmp(a.score, b.score);
    if (!d) return { w: 0 };
    const win = d > 0 ? a : b;
    return { w: d > 0 ? 1 : -1, mult: S4_MULT[win.cat], why: win.label };
  }

  // ───── 每一关：每两个人互相比，赢的拿 底注 × 倍数 ─────
  function settle(players, evalFn, compareFn, ante) {
    const evals = {};
    for (const p of players) evals[p.id] = evalFn(p);
    const delta = {};
    players.forEach(p => (delta[p.id] = 0));
    const duels = [];
    for (let i = 0; i < players.length; i++)
      for (let k = i + 1; k < players.length; k++) {
        const A = players[i], B = players[k];
        const r = compareFn(evals[A.id], evals[B.id]);
        if (!r.w) { duels.push({ a: A.id, b: B.id, tie: true, rps: !!r.rps }); continue; }
        const win = r.w > 0 ? A : B, lose = r.w > 0 ? B : A;
        const amt = ante * r.mult;
        delta[win.id] += amt;
        delta[lose.id] -= amt;
        duels.push({ win: win.id, lose: lose.id, amt, mult: r.mult, why: r.why });
      }
    return { evals, delta, duels };
  }

  function evalOne(stage, hand, community, arr) {
    if (stage === 1) return { card: hand[0], label: s1Label(hand[0]) };
    if (stage === 2) return s2Eval(hand.slice(0, 3));
    if (stage === 3) return s3Eval(hand.slice(0, 5), arr);
    return s4Eval([...hand.slice(0, 5), ...community], arr);
  }
  function stageSettle(stage, players, community, ante) {
    const ev = p => evalOne(stage, p.hand, community, p.arr);
    if (stage === 1) return settle(players, ev, (a, b) => s1Compare(a.card, b.card), ante);
    return settle(players, ev, stage === 2 ? s2Compare : stage === 3 ? s3Compare : s4Compare, ante);
  }

  return { newDeck, rollAnte, stageSettle, evalOne, bottomOk, pt, s1Compare, s2Eval, s2Compare, s3Eval, s3Compare, s4Eval, s4Compare, isBigA };
})();
if (typeof module !== 'undefined') module.exports = NDG;

// Ban Luck（马来西亚 21 点）和 Avalon 的规则（纯函数）
const BL = (() => {
  // A：2 张时算 11 或 10；3 张时算 10 或 1；4–5 张时算 1
  function total(hand) {
    let base = 0, aces = 0;
    for (const c of hand) { if (c.r === 1) aces++; else base += c.r >= 10 ? 10 : c.r; }
    const opts = hand.length === 2 ? [11, 10] : hand.length === 3 ? [10, 1] : [1];
    let sums = [base];
    for (let k = 0; k < aces; k++) sums = sums.flatMap(s => opts.map(v => s + v));
    const ok = sums.filter(s => s <= 21);
    return ok.length ? Math.max(...ok) : Math.min(...sums);
  }
  // 牌型：rank 越大越强；mult = 赢的时候的倍数
  function evalHand(hand) {
    const t = total(hand);
    const n = hand.length;
    if (n === 2 && hand[0].r === 1 && hand[1].r === 1) return { t: 21, rank: 6, mult: 3, label: 'Ban Ban ×3' };
    if (n === 2 && hand.some(c => c.r === 1) && hand.some(c => c.r >= 10)) return { t: 21, rank: 5, mult: 2, label: 'Ban Luck ×2' };
    if (n === 3 && hand.every(c => c.r === 7)) return { t: 21, rank: 7, mult: 7, label: '777 ×7' };
    if (t > 21) return { t, rank: -1, mult: 1, label: '爆了 ' + t };
    if (n === 5) return t === 21 ? { t, rank: 4, mult: 3, label: '五龙 21 ×3' } : { t, rank: 3, mult: 2, label: '五龙 ×2' };
    if (n === 2 && hand[0].r === hand[1].r) return { t, rank: 0, mult: 2, label: '对子 ' + t + ' 点 ×2' }; // 两张一样：double
    return { t, rank: 0, mult: 1, label: t + ' 点' };
  }
  const isSpecialDeal = e => e.rank === 5 || e.rank === 6;
  // 闲家 vs 庄家：回传 >0 闲家赢 的倍数，<0 庄家赢 的倍数，0 和
  function versus(p, b) {
    if (p.rank === -1 && b.rank === -1) return 0;
    if (p.rank === -1) return -Math.max(1, b.mult);
    if (b.rank === -1) return p.mult;
    if (p.rank !== b.rank) return p.rank > b.rank ? p.mult : -b.mult;
    if (p.rank === 0) return p.t === b.t ? 0 : p.t > b.t ? p.mult : -b.mult; // 对子赢的话 ×2
    return 0;
  }
  const canStand = hand => hand.length >= 5 || total(hand) >= 16;
  return { total, evalHand, versus, isSpecialDeal, canStand };
})();

const AV = (() => {
  const TEAM = { 5: [2, 3, 2, 3, 3], 6: [2, 3, 4, 3, 4], 7: [2, 3, 3, 4, 4], 8: [3, 4, 4, 5, 5], 9: [3, 4, 4, 5, 5], 10: [3, 4, 4, 5, 5] };
  const EVIL = { 5: 2, 6: 2, 7: 3, 8: 3, 9: 3, 10: 4 };
  const ROLE = {
    merlin: { name: '梅林', good: true, tip: '你看得到坏人（莫德雷德除外）。别被刺客认出来。' },
    percival: { name: '派西维尔', good: true, tip: '你看到两个人，其中一个是梅林，一个是莫甘娜。' },
    servant: { name: '亚瑟的忠臣', good: true, tip: '你什么都不知道。找出坏人，任务投成功。' },
    assassin: { name: '刺客', good: false, tip: '好人赢三次任务后，你可以刺杀梅林翻盘。' },
    morgana: { name: '莫甘娜', good: false, tip: '派西维尔会把你当成梅林之一。' },
    mordred: { name: '莫德雷德', good: false, tip: '梅林看不到你。' },
    oberon: { name: '奥伯伦', good: false, tip: '你是坏人，但队友不知道你，你也不知道他们。' },
    minion: { name: '莫德雷德的爪牙', good: false, tip: '你认识其他坏人。任务可以投失败。' },
  };
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const k = Math.floor(Math.random() * (i + 1)); [a[i], a[k]] = [a[k], a[i]]; } return a; }
  function deal(pids, opts) {
    const n = pids.length, ne = EVIL[n];
    const evil = ['assassin'];
    if (opts.morgana && opts.percival) evil.push('morgana');
    if (opts.mordred) evil.push('mordred');
    if (opts.oberon) evil.push('oberon');
    while (evil.length > ne) evil.pop();
    while (evil.length < ne) evil.push('minion');
    const good = ['merlin'];
    if (opts.percival) good.push('percival');
    while (good.length < n - ne) good.push('servant');
    const roles = shuffle([...good, ...evil]);
    const out = {}; pids.forEach((p, i) => (out[p] = roles[i]));
    return out;
  }
  // 我知道谁：回传 [{pid, as}]
  function knows(roles, me) {
    const r = roles[me], out = [];
    for (const [p, q] of Object.entries(roles)) {
      if (p === me) continue;
      if (r === 'merlin' && !ROLE[q].good && q !== 'mordred') out.push({ pid: p, as: '坏人' });
      if (r === 'percival' && (q === 'merlin' || q === 'morgana')) out.push({ pid: p, as: '梅林？' });
      if (!ROLE[r].good && r !== 'oberon' && !ROLE[q].good && q !== 'oberon') out.push({ pid: p, as: '队友（坏人）' });
    }
    return out;
  }
  const failsNeeded = (n, quest) => (quest === 3 && n >= 7 ? 2 : 1);
  return { TEAM, EVIL, ROLE, deal, knows, failsNeeded, shuffle };
})();

if (typeof module !== 'undefined') module.exports = { BL, AV };

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const k = Math.floor(Math.random() * (i + 1)); [a[i], a[k]] = [a[k], a[i]]; } return a; };
  const gopt = (st, game) => ({ ...(GAMES[game].defaults || {}), ...((st.opts || {})[game] || {}) });
  function rng32(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // ───────── 首页 ─────────

    const name = () => {

  // ───────── 排行榜 + 我的战绩 ─────────
  const BOARD = [
    ['race', '🪢 Swing 比快', r => (+r.v).toFixed(2) + ' 秒'], ['survive', '🪢 Swing 撑最久', r => (+r.v).toFixed(1) + ' 秒'],
    ['snake', '🐍 贪吃蛇 最长', r => r.v + ' 节'], ['land', '🐍 占地盘 最多', r => r.v + '%'],
    ['shoot', '🔫 大乱斗 总击杀', r => r.v + ' 杀'], ['mini', '🎪 小游戏 冠军', r => r.v + ' 次'],
    ['mind', '🧠 心有灵犀 最高', r => '第 ' + r.v + ' 关'], ['tug', '💪 拔河 胜场', r => r.v + ' 胜'],

    ['ndg', '🍄 牛冬菇 总赢', r => sign(+r.v)], ['banluck', '🃏 Ban Luck 总赢', r => sign(+r.v)],

  // 记成绩（有户口才记；同一局只记一次）
  const recorded = new Set();
  function record(game, kind, value, extra, key) {
    if (!acct || recorded.has(key) || value == null || isNaN(value)) return;
    recorded.add(key);
    sb.rpc('jk_record', { p_token: acct.token, p_game: game, p_kind: kind, p_value: value, p_extra: extra || {}, p_key: key }).then(({ error }) => {
      if (error && /重新登入/.test(error.message)) { acct = null; store.del('pg.acct'); fx.toast('登入过期了，回首页重新登入才会记成绩'); }
    });
  }

  // ───────── 服务器 ─────────
  function newCode() {
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    return Array.from({ length: 4 }, () => A[Math.floor(Math.random() * A.length)]).join('');
  }
  function loading(msg) { V = null; netMsg = msg; render(); }

  async function createRoom() {
    if (!sb) return home('联机工具载入失败');
    loading('正在开房间…');
    for (let i = 0; i < 6; i++) {
      const c = newCode();
      const st = { v: VER, code: c, hostId: me.id, startChips: 100, players: [{ id: me.id, name: me.name, chips: 100 }], game: 'ndg', phase: 'lobby', g: {}, gid: 0, opts: {}, pick: null, night: {}, last: null };
      const { error } = await sb.from('ndg_rooms').insert({ code: c, state: st, ver: 1 });
      if (!error) return joinRoom(c);
      if (error.code !== '23505') return home('开房间失败：' + error.message);
    }
    home('开房间失败，再试一次');
  }

  async function joinRoom(c) {
    if (!sb) return home('联机工具载入失败');
    loading('进入房间 ' + c + '…');
    const { data, error } = await sb.from('ndg_rooms').select('state,ver').eq('code', c).maybeSingle();
    if (error) return home('连不到服务器：' + error.message);
    if (c === HALL && (!data || data.state.v !== VER)) { // 大厅不在 / 是旧版：重新开一个（谁先到谁当房主）
      const st = { v: VER, code: HALL, hostId: me.id, startChips: 100, players: [{ id: me.id, name: me.name, chips: 100 }], game: 'ndg', phase: 'lobby', g: {}, gid: 0, opts: {}, pick: null, night: {}, wins: {}, last: null };
      const r = data ? await sb.from('ndg_rooms').update({ state: st, ver: (data.ver || 0) + 1 }).eq('code', HALL) : await sb.from('ndg_rooms').insert({ code: HALL, state: st, ver: 1 });
      if (r.error && r.error.code !== '23505') return home('开大厅失败：' + r.error.message);
      return joinRoom(HALL);
    }
    if (!data) { store.del('pg.lastRoom'); return home('找不到房间 ' + c + '，房间码对吗？'); }
    if (data.state.v !== VER) { store.del('pg.lastRoom'); return home('这个房间是旧版开的，请开一个新房间'); }
    const known = data.state.players.some(p => p.id === me.id);
    if (!known && c !== HALL && data.state.players.length >= MAX) return home('房间满了（最多 ' + MAX + ' 人）');
    const { error: e2 } = await sb.from('ndg_players').upsert({ code: c, pid: me.id, name: me.name });
    if (e2) return home('加入失败：' + e2.message);
    code = c;
    store.set('pg.lastRoom', c);
    history.replaceState(null, '', location.pathname + '?room=' + c);
    netMsg = '';
    applyState(data.state, data.ver);
    await loadRows();
    subscribe();
    if (role === 'host') syncPlayers();
  }

  async function loadRows() {
    const c = code;
    const { data } = await sb.from('ndg_players').select('pid,name').eq('code', c);
    if (data && c === code) rows = data;
  }
  async function refresh() {
    if (!code) return;
    const c = code;
    const { data } = await sb.from('ndg_rooms').select('state,ver').eq('code', c).maybeSingle();
    if (code !== c) return;
    if (!data) { store.del('pg.lastRoom'); return home('房间已经关了'); }
    if (data.ver !== ver && !busy) applyState(data.state, data.ver);
    await loadRows();
    if (role === 'host') syncPlayers(); else render();
  }

  function subscribe() {
    chan = sb.channel('room-' + code, { config: { presence: { key: me.id }, broadcast: { self: false } } });
    chan
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'ndg_rooms', filter: 'code=eq.' + code }, p => {
        if (p.new && p.new.ver > ver) applyState(p.new.state, p.new.ver);
      })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'ndg_rooms' }, p => {
        if (p.old && p.old.code === code) { store.del('pg.lastRoom'); home('房主关了房间'); }
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'ndg_players', filter: 'code=eq.' + code }, async () => {
        await loadRows();
        if (role === 'host') syncPlayers(); else render();
      })
      .on('broadcast', { event: 'g' }, ({ payload }) => { const G = S && S.phase === 'play' && GAMES[S.game]; if (G && G.onMsg && payload) { try { G.onMsg(payload); } catch (e) { console.error(e); } } })
      .on('broadcast', { event: 'e' }, ({ payload }) => { if (payload) fx.emoji(payload.e, pname(payload.id), pcolor(payload.id)); })
      .on('presence', { event: 'sync' }, () => { online = new Set(Object.keys(chan.presenceState())); render(); })
      .subscribe(status => {
        if (status === 'SUBSCRIBED') { chan.track({ at: Date.now() }); if (netMsg) { netMsg = ''; render(); } refresh(); }
        else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') { netMsg = '网络不稳，重连中…'; render(); }
      });
    poll = setInterval(refresh, 4000);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

  // 大画面模式的快速通道：手机直接连到大画面（同一个 wifi 很快），连不到就走服务器
  const fast = { peer: null, conn: null, key: '' };
  function loadPeer() {
    if (window.Peer) return Promise.resolve(true);
    return new Promise(res => { const s = document.createElement('script'); s.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'; s.onload = () => res(true); s.onerror = () => res(false); document.head.appendChild(s); });
  }
  async function fastStart(asScreen, onMsg) {
    const key = code + (asScreen ? ':scr' : ':pad');
    if (fast.key === key) return;
    fastStop(); fast.key = key;
    if (!(await loadPeer()) || fast.key !== key) return;
    const id = 'jkparty-' + code + '-scr';
    try {
      if (asScreen) {
        fast.peer = new Peer(id, { debug: 0 });
        fast.peer.on('connection', c => c.on('data', m => onMsg(m)));
      } else {
        fast.peer = new Peer({ debug: 0 });
        fast.peer.on('open', () => { fast.conn = fast.peer.connect(id, { reliable: false }); });
      }
      fast.peer.on('error', () => {});
    } catch {}
  }
  function fastStop() { try { fast.peer && fast.peer.destroy(); } catch {} fast.peer = null; fast.conn = null; fast.key = ''; }
  function fastSend(payload) { try { if (fast.conn && fast.conn.open) fast.conn.send(payload); } catch {} bcast(payload); }
  function bcast(payload) { if (chan) { try { chan.send({ type: 'broadcast', event: 'g', payload }); } catch {} } }
  // 免费服务器一秒最多 100 条消息：人越多，每个人发得越慢
  const netHz = n => clamp(Math.floor(64 / Math.max(1, n)), 4, 12);
  let lastEmoji = 0;
  function sendEmoji(e) {
    const now = Date.now(); if (now - lastEmoji < 600) return; lastEmoji = now;
    fx.emoji(e, me.name, pcolor(me.id));
    if (chan) { try { chan.send({ type: 'broadcast', event: 'e', payload: { id: me.id, e } }); } catch {} }
  }
  function leaveRoom(keepLast) {
    if (chan) { try { sb.removeChannel(chan); } catch {} }
    chan = null; clearInterval(poll); poll = null;
    code = null; S = null; V = null; rows = []; online = new Set(); role = null; ui = {};
    if (!keepLast) store.del('pg.lastRoom');
    if (typeof stopAllGames === 'function') stopAllGames();
  }

  function applyState(st, v) {
    S = st; ver = v;
    role = S.hostId === me.id ? 'host' : 'guest';
    render();
  }

  // 改状态 → 写回服务器（同时有人改就拿新的再做一次）
  async function save(mutate) {
    if (!S || !code) return false;
    while (busy) await new Promise(r => setTimeout(r, 40));
    if (!S || !code) return false;
    busy = true;
    try {
      for (let tries = 0; tries < 12; tries++) {
        const next = JSON.parse(JSON.stringify(S)), base = ver, c = code;
        if (mutate(next) === false) return false;
        const { data, error } = await sb.from('ndg_rooms').update({ state: next, ver: base + 1, updated_at: new Date().toISOString() }).eq('code', c).eq('ver', base).select('ver');
        if (code !== c) return false;
        if (error) { fx.toast('存不进去：' + error.message); return false; }
        if (data && data.length) { if (base + 1 >= ver) applyState(next, base + 1); return true; }
        await new Promise(r => setTimeout(r, 60 + Math.random() * 160));
        const fresh = await sb.from('ndg_rooms').select('state,ver').eq('code', c).maybeSingle();
        if (code !== c) return false;
        if (fresh.data) { S = fresh.data.state; ver = fresh.data.ver; role = S.hostId === me.id ? 'host' : 'guest'; }
      }
      fx.toast('太多人同时按，再按一次');
      return false;
    } finally { busy = false; }
  }

  // 报名的人还没进 players 的，房主帮他们加进去
  function syncPlayers() {
    if (!S) return;
    const need = rows.some(r => { const p = S.players.find(x => x.id === r.pid); return !p || p.name !== r.name; });
    if (!need) return render();
    save(st => {
      let ch = false;
      for (const r of rows) {
        const p = st.players.find(x => x.id === r.pid);
        if (p) { if (p.name !== r.name) { p.name = r.name; ch = true; } }
        else if (st.players.length < MAX) { st.players.push({ id: r.pid, name: r.name, chips: st.startChips }); ch = true; }
      }
      return ch;
    });
  }

  function viewFor(pid) {
    const players = S.players.map(p => ({ ...p, online: isOn(p.id) }));
    const base = { ...S, players, you: pid };
    if (S.phase === 'play' && GAMES[S.game]) { try { base.g = GAMES[S.game].view(S, pid); } catch (e) { console.error(e); base.broken = true; } }
    return base;
  }

  // 今晚排行：每个游戏的前三名拿 3 / 2 / 1 分
  function award(st, ids) {
    st.night = st.night || {};
    ids = ids.filter(id => !isBot(id));
    ids.slice(0, 3).forEach((id, i) => { st.night[id] = (st.night[id] || 0) + 3 - i; });
    if (ids[0]) { st.wins = st.wins || {}; st.wins[ids[0]] = (st.wins[ids[0]] || 0) + 1; } // 拿第一的次数
    st.last = { game: st.game, top: ids.slice(0, 3) };
  }

  const awardTeam = (st, ids, pts = 2) => { st.night = st.night || {}; ids.forEach(id => { if (!isBot(id)) st.night[id] = (st.night[id] || 0) + pts; }); st.last = { game: st.game, top: ids.slice(0, 3) }; };

  // ───────── 大厅操作（房主） ─────────
  const lobby = {
    chips(v) {
      const n = clamp(Math.round(+v) || 100, 1, 100000);
      save(st => { st.startChips = n; st.players.forEach(p => (p.chips = n)); });
    },
    bot() {
      save(st => {
        if (st.players.length >= MAX) return false;
        const n = st.players.filter(p => p.bot).length + 1;
        st.players.push({ id: 'bot' + uid(), name: '电脑 ' + n, chips: st.startChips, bot: true });
      });
    },
    async kick(id) {
      if (id === S.hostId) return;
      if (!isBot(id)) await sb.from('ndg_players').delete().eq('code', code).eq('pid', id);
      save(st => { st.players = st.players.filter(p => p.id !== id); });
    },
    pickGame(g) { if (S.game !== g) save(st => { st.game = g; }); },
    opt(game, k, v) { save(st => { st.opts[game] = { ...(st.opts[game] || {}), [k]: v }; }); },
    optToggle(game, k, id) { save(st => { const o = { ...(st.opts[game] || {}) }, m = { ...(o[k] || {}) }; if (m[id]) delete m[id]; else m[id] = true; o[k] = m; st.opts[game] = o; }); },
    spin() {
      const keys = Object.keys(GAMES).filter(k => S.players.length >= GAMES[k].min);
      const g = keys[Math.floor(Math.random() * keys.length)];
      save(st => { st.game = g; st.pick = { game: g, n: (st.pick ? st.pick.n : 0) + 1 }; });
    },
    start() {
      const G = GAMES[S.game];
      if (S.players.filter(p => isOn(p.id)).length < G.min) return fx.toast(G.name + ' 至少要 ' + G.min + ' 个在线的人');
      save(st => {
        const G2 = GAMES[st.game];
        const ids = st.players.map(p => p.id).filter(isOn).slice(0, G2.max); // 不在线的人不发牌
        if (ids.length < G2.min) return false;
        st.phase = 'play'; st.gid = (st.gid || 0) + 1;
        st.g = G2.start(st, ids);

  const lrDie = (d, cls = '') => `<div class="die d${d} ${cls}">${'<i></i>'.repeat(d)}</div>`;

  // ═════════ 炸弹传递 ═════════

  GAMES.just = {
    icon: '💥', name: '别撞词', sub: '全队写提示，撞到一样的会消失', how: '轮流一个人猜。其他人看到秘密词，各写一个提示词。两个人写一样的话，那两个提示都会消失，所以要猜别人会写什么然后避开。猜的人只看到剩下的提示。全队一起猜 10 张，看拿几分。', tags: ['合作', '猜词', '派对'], color: '#e67e22', min: 3, max: 12, chips: false, fresh: true,
    start(st, ids) {

    // 在旁边看的人（这局没有你）：房主可以直接结束；房主不在了可以接手
    const watching = inGame && S.g && !JSON.stringify(S.g).includes(me.id);
    const watchBar = !watching ? '' : `<div class="note watch"><span>这局你在旁边看</span>${isHost ? '<button class="pill" id="wEnd">结束这局，回大厅</button>' : !online.has(S.hostId) ? '<button class="pill" id="wTake">房主不在了，我来当房主</button>' : ''}</div>`;
    const top = `<div class="top">
        <button class="roomchip" id="menuBtn"><i>房间</i>${esc(V.code)}</button>
        <b class="ttl">${inGame ? G.icon + ' ' + G.name : '大厅'}</b>
        <span class="tr">${inGame && G.chips && meP ? `<span class="mych"><i class="coin"></i>${meP.chips}</span>` : ''}${full ? `<button class="ib rot" id="rotBtn" aria-label="横屏">${document.fullscreenElement ? '⤢' : '📱↔'}</button>` : ''}<button class="ib" id="emoBtn" aria-label="表情">😀</button><button class="ib" id="menuBtn2" aria-label="菜单">☰</button></span>
      </div>${ui.emo ? `<div class="emobar">${EMOJIS.map(e => `<button data-emo="${e}">${e}</button>`).join('')}</div>` : ''}${netMsg ? `<div class="note">${esc(netMsg)}</div>` : ''}${watchBar}`;
    const html = `<div class="${full ? 'stage' : 'page'}">${top}${body}</div>${ui.menu ? menuHTML(V, inGame, G) : ''}${hostReqHTML()}`;
    if (inGame && G.record) { try { G.record(V); } catch (e) { console.error(e); } }
    if (html === lastHTML && !force) return;
    // 正在打字：先不要重画（重画会把输入格换掉，手机键盘就收起来 / 出不来）。打完（离开输入格）再画
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA') && ae.type !== 'range' && ae.id && app.contains(ae) && html.includes(`id="${ae.id}"`)) { typingWait = true; return; }
    typingWait = false;
    lastHTML = html;
    app.className = full ? 'full' : '';
    app.innerHTML = html;
    $$('.sq:not(.open)').forEach(mountSqueeze);
    // 上面那排
    const menu = v => { ui.menu = v; render(true); };
    on('menuBtn', () => menu(true)); on('menuBtn2', () => menu(true)); on('menuX', () => menu(false));
    on('menuBg', e => { if (e.target.id === 'menuBg') menu(false); });
    on('emoBtn', () => { ui.emo = !ui.emo; render(true); });
    on('rotBtn', async () => { // 横屏：全屏 + 锁横向（Android 可以；iPhone 不给锁，就提示自己转）
      try { if (document.fullscreenElement) { await document.exitFullscreen(); try { screen.orientation.unlock(); } catch {} render(true); return; } await (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement); await screen.orientation.lock('landscape'); render(true); }
      catch { fx.toast('把手机横过来就可以（iPhone 要先关掉「竖屏锁定」）'); } });
    $$('[data-emo]').forEach(b => (b.onclick = () => sendEmoji(b.dataset.emo)));
    on('mSound', () => { sfx.toggle(); render(true); });
    on('mLobby', () => { ui.menu = false; lobby.toLobby(); });
    on('mBoard', () => { ui.menu = false; boardPage(); });
    $$('[data-gh2]').forEach(b => (b.onclick = () => { if (confirm('让 ' + pname(b.dataset.gh2) + ' 当房主？')) { ui.menu = false; lobby.giveHost(b.dataset.gh2); } }));
    on('wEnd', () => { if (confirm('结束这一局，大家回大厅？')) lobby.toLobby(); }); on('wTake', lobby.takeover);
    on('mChips', lobby.resetChips); on('mNight', lobby.resetNight); on('mExit', lobby.exit); on('mClose', lobby.close);
    on('lReq', lobby.requestHost); on('lSuper', lobby.superHost);
    on('mReq', () => { ui.menu = false; lobby.requestHost(); }); on('mSuper', () => { ui.menu = false; lobby.superHost(); });
    on('hrYes', () => lobby.answerHost(true)); on('hrNo', () => lobby.answerHost(false));
    on('mLeave', lobby.leave); on('mTake', () => { ui.menu = false; lobby.takeover(); }); on('takeover', lobby.takeover);
    if (!inGame) {
      const link = location.origin + location.pathname + '?room=' + V.code;
      on('copy', () => { const done = () => { fx.toast('链接复制了，丢进群'); sfx.ok(); }; if (navigator.clipboard) navigator.clipboard.writeText(link).then(done, () => fx.toast(link)); else fx.toast(link); });
      on('privRoom', () => { if (confirm('开一个只有你们的私人房间？')) createRoom(); });
      on('bot', lobby.bot); on('start', () => { sfx.tap(); lobby.start(); }); on('spin', lobby.spin);
      $$('[data-game]').forEach(b => (b.onclick = () => { if (isHost) { sfx.tap(); lobby.pickGame(b.dataset.game); } else fx.toast('房主才能选游戏'); }));
      $$('[data-cat]').forEach(b => (b.onclick = () => { ui.cat = b.dataset.cat; render(true); }));
      const gs = $('#gSearch'); if (gs) { const doF = () => { ui.q = gs.value.trim(); const q = ui.q.toLowerCase(), num = /^\d+$/.test(q) ? +q : null; let shown = 0; $$('.tiles .tile').forEach(t => { const ok = !q || (num != null ? num >= +t.dataset.min && num <= +t.dataset.max : q.split(/\s+/).every(w => t.dataset.s.includes(w))); t.classList.toggle('hide', !ok); if (ok) shown++; }); const nn = $('.gnone'); if (nn) nn.classList.toggle('hide', shown > 0); const gc = $('#gClear'); if (gc) gc.classList.toggle('hide', !q); }; gs.oninput = doF; doF(); on('gClear', () => { gs.value = ''; doF(); gs.focus(); }); }
      $$('[data-kick]').forEach(b => (b.onclick = e => { e.stopPropagation(); lobby.kick(b.dataset.kick); }));
      $$('[data-gh]').forEach(b => { if (b.dataset.gh) b.onclick = () => { if (confirm('让 ' + pname(b.dataset.gh) + ' 当房主？')) lobby.giveHost(b.dataset.gh); }; });
      $$('[data-chips]').forEach(b => (b.onclick = () => lobby.chips(b.dataset.chips)));
      $$('[data-optt]').forEach(b => (b.onclick = () => { const [g, k, id] = b.dataset.optt.split(':'); lobby.optToggle(g, k, id); }));
      on('wordsSave', () => { const t = ($('#wordsIn') || {}).value || ''; lobby.opt('custom', 'words', t.slice(0, 600)); fx.toast('保存了 ' + t.split(/[,，、。;；\n]/.test(t) ? /[,，、。;；\n]+/ : /\s+/).filter(Boolean).length + ' 个词'); sfx.ok(); });
      $$('[data-opt]').forEach(b => (b.onclick = () => { const [g, k, v] = b.dataset.opt.split(':'); lobby.opt(g, k, v === 'true' ? true : v === 'false' ? false : isNaN(+v) ? v : +v); }));
    } else if (fx.once('go:' + V.code + ':' + V.gid)) sfx.go();
    if (bind) { try { bind(); } catch (e) { console.error(e); } }
    if (spinTo) spinAnim(spinTo);
  }

  // 手机长按：不要跳出选字、翻译、菜单
  const typing = e => e.target && e.target.closest && e.target.closest('input,textarea');
  document.addEventListener('contextmenu', e => { if (!typing(e)) e.preventDefault(); });
  document.addEventListener('selectstart', e => { if (!typing(e)) e.preventDefault(); });
  document.addEventListener('touchstart', e => { if (e.target.closest && e.target.closest('.nohold,canvas')) e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault());
  let rsT = 0;
  window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { if (S) { invalidate(); render(); } }, 180); });

  window.__party = { ft: () => ft, im: () => im, sl: () => sl, slRow,  bl: () => bl, cw: () => cw, sw: () => sw, sn: () => sn, sh: () => sh, state: () => S, view: () => V, me, lobby, GAMES, save, fx, sfx, ui: () => ui, peeked: () => peeked };
  const qRoom = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
  // 有名字的人一打开就进大厅（或者刚才的房间）；链接带房间码就去那个房间
  const lastR = store.get('pg.lastRoom', null);
  if (sb && me.name && qRoom && qRoom === lastR) joinRoom(qRoom);
  else if (sb && me.name && !qRoom && (lastR === 'HALL' || !lastR) && store.get('pg.hallOk', true) !== false) joinRoom('HALL');
  else home();
})();

</script>
</body>
</html>
